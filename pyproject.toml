[tool.poetry]
name = "dc-event-script"
version = "1.0.2"
description = "Dragon City Event Script"
authors = ["Apod <example@email.com>"]
maintainers = [
  "Marcuth <me@marcuth.dev>"
]
readme = "README.md"
packages = [{include = "src"}]

[tool.poetry.dependencies]
python = "^3.12,<3.15"
pillow = "^12.1.1"
xlsxwriter = "^3.2.9"
opencv-python = "^4.13.0.92"
numpy = "^2.4.3"
requests = "^2.32.5"
openpyxl = "^3.1.5"
python-dotenv = "^1.2.2"
dchighs = {version = "^0.1.0", extras = ["config", "localization"]}


[tool.poetry.scripts]
start = "src.main:main"
build = "scripts.build:run_build"

[tool.poetry.group.dev.dependencies]
pyinstaller = "^6.19.0"
setuptools = "^82.0.1"
pytest = "^9.2.0"
pytest-cov = "^7.1.0"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.coverage.run]
source = ["src", "scripts"]
branch = true

[tool.coverage.report]
fail_under = 100
show_missing = true
exclude_lines = [
    "pragma: no cover",
    "if __name__ == .__main__.:",
]

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
