name: Tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    # The app is a Windows desktop application (Tkinter GUI, Windows executable), so it is tested on Windows.
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: pip install poetry
      - run: poetry install
      - name: Run the tests (fails below 100% coverage)
        run: poetry run pytest --cov
